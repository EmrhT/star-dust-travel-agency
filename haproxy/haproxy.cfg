# Runs on the Docker host and routes HTTPS to loopback-published services.
# Forwarded headers let Keycloak and nginx reconstruct the browser request.

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 1024
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend https_ingress
    bind :443 ssl crt /etc/haproxy/certs/site.pem alpn h2,http/1.1

    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Port 443
    http-request set-header X-Forwarded-Proto https

    acl is_app hdr(host) -i stardust.no-name.win
    acl is_auth hdr(host) -i auth-stardust.no-name.win

    use_backend frontend_app if is_app
    use_backend keycloak_auth if is_auth
    default_backend unknown_host

backend frontend_app
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    server frontend 127.0.0.1:3000 check

backend keycloak_auth
    option httpchk
    http-check send meth GET uri /realms/master
    http-check expect status 200
    server keycloak 127.0.0.1:8081 check

backend unknown_host
    http-request deny deny_status 421
