# Orchestrates the browser, ASP.NET API, and PostgreSQL development stack.
# Health-based dependencies preserve their runtime startup relationship.
name: star-dust-travel-agency

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-star_dust}
      POSTGRES_USER: ${POSTGRES_USER:-star_dust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: >-
        jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: >-
        ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: >-
        ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: >-
        ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: https://auth-stardust.no-name.win
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; }
          0<>/dev/tcp/127.0.0.1/9000
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    mem_limit: 1g
    stop_grace_period: 30s

  backend:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB:-star_dust};
        Username=${POSTGRES_USER:-star_dust};
        Password=${POSTGRES_PASSWORD};
        Include Error Detail=false
      Swagger__Enabled: "true"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --tries=1 --spider
          http://127.0.0.1:8080/health/live || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    stop_grace_period: 35s

  frontend:
    build:
      context: ./frontend
    environment:
      APP_API_BASE_URL: /api
      APP_AUTH_BASE_URL: https://auth-stardust.no-name.win
      APP_AUTH_REALM: star-dust
      APP_AUTH_CLIENT_ID: star-dust-web
      BACKEND_UPSTREAM: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --tries=1 --spider
          http://127.0.0.1:8080/health || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
